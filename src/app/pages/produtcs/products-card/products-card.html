<mat-card class="product-card">

  <mat-card-header>
    <mat-card-title>{{ product().name }}</mat-card-title>
    <p class="description">{{ product().description }}</p>
  </mat-card-header>
  
  <!-- Container flex que agrupa o preço (esquerdo) e o botão (direito) -->
  <div class="card-footer">
    
    <mat-card-content>
      @if (product().promotionalPrice) {
        <span class="sale-badge">Promoção</span>
        <p class="price-row">
          <span class="price">{{ product().price }}</span>
          <span class="promotional-price">{{ product().promotionalPrice }}</span>
        </p>
      } @else {
        <p class="price-row">
          <span class="price">{{ product().price }}</span>
        </p>
      }
    </mat-card-content>

    <mat-card-actions>
      <button mat-button (click)="onAddToCard()"> {{ addButtonLabel() }} </button>
    </mat-card-actions>

  </div>

</mat-card>
