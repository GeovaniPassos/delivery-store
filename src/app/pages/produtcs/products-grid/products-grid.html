<div class="products-container">

    <div class="products-grid">
        @for (product of this.productService.filteredProducts() ; track product.id) {
            @if (this.productService.categoryClick == true && 
            product.type == 'pizza') {
                <app-pizza-modal />
            } @else {
                <app-products-card [product]="product"
                (click)="this.categoryService.selectedProductClick(product)"
                (addToCart)="this.onAddToCard($event)"/>
            }
            
        } @empty {
            <div class="empty-state">
                <mat-icon>inventory_2</mat-icon>
                <h3>Nenhum produto encontrado!</h3>
                <p>Volte mais tarde para verificar se há novidades.</p>
            </div>
        }
    </div>
</div>
